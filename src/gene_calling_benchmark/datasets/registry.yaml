# Benchmark dataset registry.
#
# Each entry resolves to a (FASTA, annotation) pair plus optional ground-truth
# labels, hosted in a Zenodo record. A published Zenodo record is immutable, so
# pinning the record_id pins the exact bytes — reproducible by construction. To
# add a new dataset:
#
#   1. Upload the files to a Zenodo record and publish it (gzip large FASTAs).
#      Host the annotation as GFF3 (not GTF) so it carries distinct
#      five_prime_UTR / three_prime_UTR features and can drive UTR_CDS_INTRON
#      mode as well as EXON_INTRON.
#   2. Note the record id from the published record URL
#      (https://zenodo.org/records/<record_id>).
#   3. Record the digest of each file's *decompressed content* in `checksum` as
#      "<alg>:<hex>" (e.g. sha256). gzip is non-deterministic, so hash the
#      uncompressed data, not the .gz blob:
#        gzip -dc sequence.fa.gz | sha256sum
#      For an uncompressed upload this equals the MD5 Zenodo shows for the file.
#   4. Add an entry below.
#
# To test against a throwaway upload, publish to https://sandbox.zenodo.org and
# add ``sandbox: true`` to the entry — the loader then resolves the record from
# sandbox.zenodo.org instead of zenodo.org.

datasets:

  zenodo_test:
    description: Tiny smoke-test dataset for the Zenodo download path.
    record_id: "512849"
    sandbox: true
    fasta:
      filename: zenodo_test.fasta
      checksum: md5:1094bb8f038ee6f5c54bf2b209f52173
    annotation:
      filename: zenodo_test.gff3
      checksum: md5:156796a5705c5d8b98124e09500b040f
