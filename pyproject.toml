[project]
name = "gene-calling-benchmark"
version = "0.1.2"
description = "Metrics for nucleotide-level gene-calling benchmarking"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Benjamin Kroeger" },
]
keywords = ["genomics", "gene prediction", "gene calling", "benchmarking", "bioinformatics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Operating System :: OS Independent",
]
dependencies = [
    "click>=8.0",
    "matplotlib>=3.10.1",
    "numpy>=2.2.4",
    "pydantic>=2.0",
    "pandas>=2.2.3",
    "pooch>=1.8",
    "seaborn>=0.13.2",
    "tqdm>=4.67.1",
    "pyyaml>=6.0.0",
    "pyranges1>=1.3.5",
    "scipy>=1.10",
]

[project.optional-dependencies]
wandb = ["wandb[media]>=0.26"]
docs = [
    "myst-parser>=4.0",
    "sphinx>=8.0",
    "sphinx-autodoc-typehints>=3.0",
    "sphinx-rtd-theme>=3.0",
]

[dependency-groups]
dev = [
    "fastparquet>=2025.12.0",
    "ipykernel>=6.29.5",
    "jupyter>=1.1.1",
    "notebook>=7.4.2",
    "pyarrow>=23.0.1",
    "pytest>=8.3.5",
    "ruff>=0.11.2",
    "sphinx-autobuild>=2025.8.25",
]

[build-system]
requires = ["setuptools>=77.0"]  # >=77 understands the SPDX `license = "MIT"` string (PEP 639)
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"gene_calling_benchmark" = ["icons/*.png"]
"gene_calling_benchmark.datasets" = ["registry.yaml"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]  # makes the `support` package importable from unit/ and integration/
addopts = ["-m", "not network"]  # run network tests explicitly with `-m network`
markers = [
    "network: test requires network access (Zenodo sandbox); skips if unreachable.",
]

[project.scripts]
gene-benchmark = "gene_calling_benchmark.cli:cli"

[project.urls]
"Documentation" = "https://gene-calling-benchmark.readthedocs.io/en/latest/"
"Source Code" = "https://github.com/benjamin-kroeger/gene-calling-benchmark"
"Bug Tracker" = "https://github.com/benjamin-kroeger/gene-calling-benchmark/issues"
